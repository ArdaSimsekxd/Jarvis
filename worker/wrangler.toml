# Jarvis'in anında cevap veren kısmı (Cloudflare Workers, ücretsiz plan).
# Kurulumu .github/workflows/deploy-worker.yml kendiliğinden yapar.
name = "jarvis"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"   # kurulum sırasında doldurulur

# Yapay zekâ (Cloudflare Workers AI): normal cümleleri ve sesli mesajları anlamak için. Günde 10.000 "neuron" ücretsiz.
[ai]
binding = "AI"

[triggers]
crons = ["*/2 * * * *"]   # 2 dakikada bir: hatırlatmalar + GitHub'daki işlerin zamanlaması

[vars]
GITHUB_REPO = "ArdaSimsekxd/Jarvis"   # bot, Canvas/mail kontrolünü ve sabah özetini bu repoda başlatır
MENU_URL = "https://raw.githubusercontent.com/ArdaSimsekxd/Jarvis/main/data/menu.json"
BOOKED_URL = "https://booked.agu.edu.tr/Web"   # okulun rezervasyon sitesi; /fitness komutu resmi API'sini kullanır
FITNESS_RESOURCE_ID = "3"                      # sitedeki FITNESS CENTER kaynağının numarası
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"   # botun düşünürken kullandığı model; değiştirmek için bu satır yeterli
