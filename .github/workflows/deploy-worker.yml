name: Botu kur

# worker/ klasörü değişince botu Cloudflare'e yeniden kurar. Elle de çalıştırılabilir.
on:
  push:
    paths:
      - "worker/**"
      - "scripts/deploy_worker.sh"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}   # isteğe bağlı: botun işleri zamanında başlatması için
      CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}       # /odevler ve /notlar komutları için
      CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL || 'https://canvas.agu.edu.tr' }}
      DERS_PROGRAMI: ${{ secrets.DERS_PROGRAMI }}     # isteğe bağlı: /dersler komutu için
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testler
        working-directory: worker
        run: node --test
      - name: Anahtar var mı?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret'ı henüz girilmemiş, kurulum atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare'e kur
        if: steps.check.outputs.ready == 'true'
        run: scripts/deploy_worker.sh
